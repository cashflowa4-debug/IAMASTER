<!DOCTYPE html>

<style>
:root{--b:#0a1f44;--b2:#1e3a8a;--o:#f59e0b;--o2:#fbbf24;--v:#059669;--r:#dc2626;--bg:#f3f4f6;--c:#fff;--t:#1a1a1a;--m:#6b7280;--br:#e5e7eb;--pp:#9333ea}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--t);font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:72px}
#netBar{position:fixed;top:0;left:0;right:0;height:22px;line-height:22px;text-align:center;font-size:11px;font-weight:600;z-index:9999;background:#d1fae5;color:#065f46}
#netBar.off{background:#fee2e2;color:#991b1b}
body.learner-mode #netBar{display:none!important}body.learner-mode .screen{padding-top:0}body.learner-mode .topbar{top:0}
.screen{display:none;min-height:100vh;padding-top:22px}.screen.active{display:block}
.topbar{position:sticky;top:22px;background:var(--b);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:100}
.topbar h1{font-size:15px;font-weight:800;flex:1}.topbar h1 span{color:var(--o2)}
.btn-logout{background:rgba(255,255,255,.2);border:none;color:#fff;padding:7px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.view{display:none;padding:16px}.view.active{display:block}
.navbar{position:fixed;bottom:0;left:0;right:0;background:var(--c);display:flex;border-top:1px solid var(--br);z-index:100;overflow-x:auto}
.nav-item{flex:1;background:none;border:none;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--m);font-size:9px;font-weight:600;cursor:pointer;font-family:inherit;position:relative;min-width:60px}
.nav-icon{font-size:18px}.nav-item.active{color:var(--b2)}
.nav-badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--r);color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:10px;min-width:14px;text-align:center}
.card{background:var(--c);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-title{font-size:12px;color:var(--m);font-weight:700;text-transform:uppercase;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--c);border-radius:14px;padding:14px}
.stat-label{font-size:10px;color:var(--m);font-weight:600;text-transform:uppercase}
.stat-value{font-size:20px;font-weight:800;color:var(--b);margin-top:4px}
.stat.hl{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff}.stat.hl .stat-label{color:var(--o2)}.stat.hl .stat-value{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:12px;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:active{opacity:.8}
.btn-primary{background:var(--b);color:#fff}.btn-or{background:var(--o);color:#fff}.btn-vert{background:var(--v);color:#fff}.btn-rouge{background:var(--r);color:#fff}
.btn-outline{background:transparent;border:2px solid var(--b);color:var(--b)}
.btn-block{display:flex;width:100%}.btn-sm{padding:8px 12px;font-size:13px;border-radius:8px}
.form-group{margin-bottom:14px}.form-label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.form-input,.form-textarea,.form-select{width:100%;padding:12px;border:2px solid var(--br);border-radius:10px;font-size:16px;font-family:inherit;background:var(--c);color:var(--t)}
.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--b2)}
.form-textarea{resize:vertical;min-height:90px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--o));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center}
.row{background:var(--c);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer}

.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}

.badge-gris{background:#e5e7eb;color:var(--m)}.badge-bleu{background:#dbeafe;color:var(--b2)}.badge-rouge{background:#fee2e2;color:var(--r)}
.login-screen{min-height:100vh;background:linear-gradient(135deg,var(--b),var(--b2) 60%,var(--o));display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;color:#fff;text-align:center;padding-top:22px}
.login-screen h1{font-size:38px;font-weight:900;margin-bottom:8px}.login-screen h1 span{color:var(--o2)}
.login-screen .quote{font-size:14px;opacity:.9;margin-bottom:32px;font-style:italic;max-width:85%}
.login-btn{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);color:#fff;padding:16px 22px;border-radius:14px;width:100%;max-width:320px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;gap:12px;font-family:inherit;text-align:left}
.login-btn .icon{font-size:26px}.login-btn .txt{flex:1}.login-btn .sub{font-size:11px;opacity:.8;font-weight:400;display:block}
.mod-card{background:var(--c);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;display:flex;gap:12px;align-items:center;border-left:5px solid var(--o)}
.mod-card.done{border-left-color:var(--v)}.mod-card.locked{opacity:.55;border-left-color:var(--m);background:#f9fafb}
.mod-card .num{width:40px;height:40px;border-radius:50%;background:var(--b);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
.mod-card.done .num{background:var(--v)}.mod-card h3{font-size:14px;color:var(--b);margin-bottom:2px}.mod-card small{font-size:12px;color:var(--m)}

.lesson h4{color:var(--b);font-size:14px;margin-bottom:8px;font-weight:800}.lesson p{font-size:14px;line-height:1.7;white-space:pre-line}
.prompt-box{background:var(--b);color:#e0e7ff;padding:12px;border-radius:8px;font-family:Consolas,monospace;font-size:12px;margin:8px 0;line-height:1.6;white-space:pre-line}

.progress-bar{height:8px;background:var(--br);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--o),var(--v));border-radius:4px}
.search-bar{position:relative;margin-bottom:12px}
.search-bar input{width:100%;padding:12px 14px 12px 40px;border:2px solid transparent;background:var(--c);border-radius:12px;font-size:16px;font-family:inherit;color:var(--t)}
.search-bar input:focus{outline:none;border-color:var(--b2)}
.search-bar::before{content:'🔍';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px}
.msg{background:var(--c);border-radius:12px;padding:12px;margin-bottom:8px;max-width:85%}
.msg-admin{background:#dbeafe;border-left:4px solid var(--b2);margin-right:auto;color:#1e3a8a}
.msg-learner{background:#d1fae5;border-left:4px solid var(--v);margin-left:auto;color:#065f46}
.msg-announcement{background:#fef3c7;border-left:4px solid var(--o);max-width:100%;color:#92400e}
.msg-meta{font-size:11px;margin-bottom:4px;font-weight:600;opacity:.8}.msg-text{font-size:14px;line-height:1.5;white-space:pre-wrap}
.empty{text-align:center;padding:40px 20px;color:var(--m)}.empty-icon{font-size:48px;margin-bottom:10px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.active{display:flex}
.modal{background:var(--c);width:100%;max-width:500px;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow-y:auto;color:var(--t)}
.modal-title{font-size:18px;font-weight:800;color:var(--b);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:var(--bg);border:none;width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--m);cursor:pointer}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--b);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:300;max-width:90%;text-align:center}

.submission{background:var(--c);border-radius:12px;padding:14px;margin-bottom:10px;border-left:4px solid var(--o)}
.submission.approved{border-left-color:var(--v)}.submission.rejected{border-left-color:var(--r)}

.s-feedback{padding:10px;border-radius:8px;margin-top:8px;font-size:13px;background:#fef3c7;color:#92400e}

.quiz-q{background:var(--c);border-radius:12px;padding:16px;margin-bottom:10px}
.quiz-q h4{font-size:14px;color:var(--b);margin-bottom:10px}
.quiz-opt{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:8px;margin-bottom:6px;cursor:pointer;border:2px solid transparent}
.quiz-opt.selected{border-color:var(--b2);background:#dbeafe;color:#1e3a8a}

.msg-input-bar{position:sticky;bottom:72px;background:var(--bg);padding:8px 0;display:flex;gap:8px;margin-top:8px}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 12px;background:var(--bg);border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:2px solid transparent}

.list-box{max-height:400px;overflow-y:auto}
.post-card{background:var(--c);border-radius:14px;padding:14px;margin-bottom:12px}
.post-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

async load(){try{const r=await fetch(`${SUPABASE_URL}/rest/v1/app_state?id=eq.main&select=data`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});if(!r.ok)throw new Error('HTTP '+r.status);const rows=await r.json();if(!rows.length||!rows[0].data||Object.keys(rows[0].data).length===0)return null;return rows[0].data;}catch(e){console.error('[Sync] load:',e);return null;}},
async save(data){if(this._saving)return;this._saving=true;try{const r=await fetch(`${SUPABASE_URL}/rest/v1/app_state`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify({id:'main',data:data,updated_at:new Date().toISOString()})});if(!r.ok)throw new Error('HTTP '+r.status);}catch(e){console.error('[Sync] save:',e);}finally{this._saving=false;}},
async test(){try{const d=await this.load();if(d===null)return{ok:true,msg:'✅ Connecté (base vide)'};return{ok:true,msg:'✅ Connecté · '+(d.learners?.length||0)+' apprenant(s)'};}catch{return{ok:false,msg:'❌ Échec'};}}
};
window.SupaSync=SupaSync;

const U={
uid:()=>Date.now().toString(36)+Math.random().toString(36).substr(2,8),
esc:s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
money:n=>new Intl.NumberFormat('fr-FR').format(Number(n)||0)+' F',
date:i=>{if(!i)return'';try{return new Date(i).toLocaleDateString('fr-FR');}catch{return'';}},
dateTime:i=>{if(!i)return'';try{const d=new Date(i);return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}catch{return'';}},
today:()=>new Date().toISOString().split('T')[0],
debounce:(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms);};},
avatar:(l,xs='')=>{if(l?.photo)return `<div class="avatar" style="background-image:url('${l.photo}');${xs}"></div>`;return `<div class="avatar" ${xs?`style="${xs}"`:''}>${(l?.name||'?').charAt(0).toUpperCase()}</div>`;},
video:(url)=>{
if(!url)return'';
const yt=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);
if(yt)return `<div style="position:relative;padding-bottom:56.25%;border-radius:10px;overflow:hidden;margin:10px 0;background:#000"><iframe src="https://www.youtube.com/embed/${yt[1]}" frameborder="0" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%"></iframe></div>`;
const vm=url.match(/vimeo\.com\/(\d+)/);
if(vm)return `<div style="position:relative;padding-bottom:56.25%;border-radius:10px;overflow:hidden;margin:10px 0;background:#000"><iframe src="https://player.vimeo.com/video/${vm[1]}" frameborder="0" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%"></iframe></div>`;
return `<video src="${U.esc(url)}" controls style="width:100%;border-radius:10px;margin:10px 0"></video>`;
}
};

const Cr={
async hash(p,s='iamaster-v12'){const d=new TextEncoder().encode(s+'::'+String(p));const b=await crypto.subtle.digest('SHA-256',d);return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');},
async verify(p,h){if(!h||typeof h!=='string')return false;for(const s of ['iamaster-v12','iamaster-v13','iamaster-v14']){const x=await Cr.hash(p,s);if(x.length!==h.length)continue;let d=0;for(let i=0;i<x.length;i++)d|=x.charCodeAt(i)^h.charCodeAt(i);if(d===0)return true;}return false;},
isStrong:p=>typeof p==='string'&&p.length>=6&&/[a-zA-Z]/.test(p)&&/\d/.test(p)&&/[^a-zA-Z\d]/.test(p),
isPin:p=>typeof p==='string'&&/^\d{4,6}$/.test(p)
};

const St={
KEY:'iamaster_v12',
LEGACY:['iamaster_v12','iamaster_v13','iamaster_v14'],
_t:null,_d:false,_cache:null,
load(){for(const k of St.LEGACY){try{const r=localStorage.getItem(k);if(r){const o=JSON.parse(r);if(o&&typeof o==='object'){St._cache=o;return o;}}}catch{}}return St._cache;},
save(d){St._cache=d;try{localStorage.setItem(St.KEY,JSON.stringify(d));}catch{}St._d=true;if(St._t)return true;St._t=setTimeout(()=>{try{if(window.SupaSync)SupaSync.save(d);}catch(e){console.error(e);}St._d=false;St._t=null;},2000);return true;},
async loadFromCloud(){if(!window.SupaSync)return null;const r=await SupaSync.load();if(r){St._cache=r;try{localStorage.setItem(St.KEY,JSON.stringify(r));}catch{}return r;}return null;},
flush(){if(St._d&&St._t){clearTimeout(St._t);St._t=null;if(window.SupaSync&&St._cache)SupaSync.save(St._cache);}}
};
window.addEventListener('beforeunload',()=>St.flush());
window.addEventListener('pagehide',()=>St.flush());

const State=(()=>{

return{

const Access={

isModuleUnlocked(l,k){if(!l)return false;if(l.hasFullAccess)return true;return(l.unlockedModules||[]).includes(Number(k));},

const Quiz={
start(mid){const l=State.currentLearner();if(!l)return;const qs=State.get().quizzes[mid]||[];if(!qs.length)return To.show('Pas de quiz');const prev=State.get().quizScores[l.id]?.[mid];document.getElementById('lv-module-detail').innerHTML=`<button class="back-btn" data-action="learner.go" data-tab="modules">← Retour</button><div class="detail-header"><h2>Quiz M${mid}</h2><p>${qs.length} questions</p></div>${prev?`<div class="info-box">Score : ${prev.score}/${prev.total}</div>`:''}<div id="quizBox">${qs.map((q,i)=>`<div class="quiz-q" data-q="${i}"><h4>${i+1}. ${U.esc(q.q)}</h4>${q.options.map((o,j)=>`<div class="quiz-opt" data-action="quiz.select" data-q="${i}" data-o="${j}"><span class="letter">${String.fromCharCode(65+j)}</span><span>${U.esc(o)}</span></div>`).join('')}</div>`).join('')}</div><button class="btn btn-or btn-block mt-12" data-action="quiz.submit" data-module="${mid}">✅ Valider</button>`;LearnerUI.showTab('module-detail');},
select(q,o,el){el.parentElement.querySelectorAll('.quiz-opt').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');el.parentElement.dataset.answer=o;},
submit(mid){const l=State.currentLearner();if(!l)return;const qs=State.get().quizzes[mid]||[];let score=0;document.querySelectorAll('.quiz-q').forEach((qEl,qi)=>{const ans=Number(qEl.dataset.answer);const c=qs[qi].correct;qEl.querySelectorAll('.quiz-opt').forEach((o,oi)=>{if(oi===c)o.classList.add('correct');else if(oi===ans)o.classList.add('wrong');});if(ans===c)score++;});const s=State.get();if(!s.quizScores[l.id])s.quizScores[l.id]={};s.quizScores[l.id][mid]={score,total:qs.length,date:new Date().toISOString()};State.save();To.show(`🎯 ${score}/${qs.length}`,score===qs.length?'success':'info');const b=document.querySelector('[data-action="quiz.submit"]');if(b)b.outerHTML=`<div class="flex mt-12"><button class="btn btn-outline btn-block" data-action="learner.go" data-tab="modules">← Modules</button><button class="btn btn-or btn-block" data-action="quiz.start" data-module="${mid}">🔄 Refaire</button></div>`;}
};

const AdminUI={
currentTab:'home',_filter:'all',_chatId:null,_commTab:'feed',
open(){const u=State.currentAdmin();if(!u)return Auth.logout();document.body.classList.remove('learner-mode');document.getElementById('adminWho').textContent=u.name||'Admin';const nav=document.getElementById('adminNav');if(nav){const io=State.isOwner();nav.querySelectorAll('.nav-item').forEach(it=>{it.style.display=(!io&&['learners','payments','settings'].includes(it.dataset.tab))?'none':'';});}Router.go('s-admin');this.go('home');Nw.refresh();},
go(tab){this.currentTab=tab;document.querySelectorAll('#s-admin .view').forEach(v=>v.classList.remove('active'));const v=document.getElementById('av-'+tab);if(v)v.classList.add('active');document.querySelectorAll('#s-admin .nav-item').forEach(n=>n.classList.remove('active'));document.querySelectorAll('#s-admin .nav-item').forEach(n=>{if(n.dataset.tab===tab)n.classList.add('active');});window.scrollTo(0,0);this.render(tab);this.badges();},
render(t){const r={home:()=>this.home(),learners:()=>this.learners(),submissions:()=>this.subs(),cms:()=>this.cms(),messages:()=>this.msgs(),community:()=>this.comm(),payments:()=>this.pays(),settings:()=>this.settings(),detail:()=>{},chat:()=>{}};try{r[t]?.();}catch(e){console.error(e);}},
badges(){const s=State.get();const io=State.isOwner();const co=State.currentCoAdmin();const mm=co?co.moduleIds||[]:Object.keys(s.modules).map(Number);const sub=s.submissions.filter(x=>x.status==='pending'&&(io||mm.includes(x.moduleId))).length;const unread=s.messages.filter(m=>m.from==='learner'&&!m.read).length;const bS=document.getElementById('adminBadgeSub'),bM=document.getElementById('adminBadgeMsg');if(bS){bS.textContent=sub;bS.style.display=sub>0?'block':'none';}if(bM){bM.textContent=unread;bM.style.display=unread>0?'block':'none';}},
home(){const s=State.get();const io=State.isOwner();const rev=s.payments.reduce((a,p)=>a+(Number(p.amount)||0),0);const pl=s.learners.filter(l=>l.hasFullAccess||(l.unlockedModules&&l.unlockedModules.length>0)).length;const cv=s.learners.length>0?Math.round((pl/s.learners.length)*100):0;const pr=s.payments.filter(p=>p.type==='Pack Complet').reduce((a,p)=>a+(Number(p.amount)||0),0);const mr=s.payments.filter(p=>p.type!=='Pack Complet').reduce((a,p)=>a+(Number(p.amount)||0),0);document.getElementById('av-home').innerHTML=`<div class="stats"><div class="stat hl"><div class="stat-label">Apprenants</div><div class="stat-value">${s.learners.length}</div></div>${io?`<div class="stat hl"><div class="stat-label">Revenus</div><div class="stat-value">${U.money(rev)}</div></div>`:`<div class="stat hl"><div class="stat-label">Co-Admin</div><div class="stat-value" style="font-size:14px">${U.esc(State.currentCoAdmin()?.name||'')}</div></div>`}<div class="stat"><div class="stat-label">Conversion</div><div class="stat-value">${cv}%</div></div><div class="stat"><div class="stat-label">Packs</div><div class="stat-value">${U.money(pr)}</div></div></div>${io?`<div class="card"><div class="card-title">📊 Modules</div><div style="display:flex;justify-content:space-between;font-size:14px"><span>Modules</span><b style="color:var(--o)">${U.money(mr)}</b></div></div>`:''}<div class="card"><div class="card-title">📜 Activité</div>${s.payments.slice(-5).reverse().map(p=>{const l=State.learner(p.learnerId);return `<div style="padding:8px 0;border-bottom:1px solid var(--br);font-size:13px"><b>${U.esc(l?.name||'?')}</b> → ${U.esc(p.type)}</div>`;}).join('')||'<p class="text-muted">Aucune activité</p>'}</div>`;},
learners(){document.getElementById('av-learners').innerHTML=`<div class="search-bar"><input type="search" id="adminSearch" placeholder="Rechercher..." data-input="admin-search"></div><div class="chip-row"><div class="chip ${this._filter==='all'?'active':''}" data-action="admin.filter" data-filter="all">Tous</div><div class="chip ${this._filter==='active'?'active':''}" data-action="admin.filter" data-filter="active">Actifs</div><div class="chip ${this._filter==='free'?'active':''}" data-action="admin.filter" data-filter="free">Gratuits</div></div><div id="adminLearnersList">${this.learnersHTML('',this._filter)}</div>`;},
learnersHTML(q,f='all'){const s=State.get();q=(q||'').toLowerCase();let list=s.learners.filter(l=>(l.name||'').toLowerCase().includes(q)||(l.phone||'').includes(q));if(f==='active')list=list.filter(l=>l.hasFullAccess||(l.unlockedModules&&l.unlockedModules.length>0));if(f==='free')list=list.filter(l=>!l.hasFullAccess&&(!l.unlockedModules||l.unlockedModules.length===0));if(!list.length)return'<div class="empty"><div class="empty-icon">👥</div><p>Aucun</p></div>';return list.map(l=>{const done=Object.values(l.exercises||{}).filter(Boolean).length;const un=s.messages.filter(m=>m.learnerId===l.id&&m.from==='learner'&&!m.read).length;const b=l.hasFullAccess?'badge-vert':(l.unlockedModules?.length>0?'badge-or':'badge-gris');const bt=l.hasFullAccess?'Pack':(l.unlockedModules?.length>0?l.unlockedModules.length+' mod.':'Gratuit');return `<div class="row" data-action="admin.openDetail" data-id="${l.id}">${U.avatar(l)}<div class="info"><b>${U.esc(l.name)} ${un?`<span class="badge badge-rouge">${un}</span>`:''}</b><small>${done}/${Object.keys(s.modules).length} · ${U.money(l.amountPaid)}</small></div><span class="badge ${b}">${bt}</span></div>`;}).join('');},
filter(f){this._filter=f;document.querySelectorAll('[data-action="admin.filter"]').forEach(c=>c.classList.remove('active'));document.querySelectorAll(`[data-action="admin.filter"][data-filter="${f}"]`).forEach(c=>c.classList.add('active'));document.getElementById('adminLearnersList').innerHTML=this.learnersHTML(document.getElementById('adminSearch')?.value||'',f);},
openDetail(id){const s=State.get();const l=State.learner(id);if(!l)return;const done=Object.values(l.exercises||{}).filter(Boolean).length;const pays=s.payments.filter(p=>p.learnerId===id);const mk=Object.keys(s.modules).map(Number).sort((a,b)=>a-b);document.getElementById('av-detail').innerHTML=`<button class="back-btn" data-action="admin.go" data-tab="learners">← Retour</button><div class="detail-header" style="display:flex;align-items:center;gap:12px">${U.avatar(l,'width:56px;height:56px;font-size:22px')}<div><h2 style="font-size:18px">${U.esc(l.name)}</h2><p>${U.esc(l.phone||'')}</p></div></div><div class="card"><div class="card-title">🔐 Accès</div><div class="flex mb-8"><button class="btn btn-vert btn-block" data-action="admin.activate" data-id="${l.id}">🎁 Activer</button><button class="btn btn-rouge btn-block" data-action="admin.deactivate" data-id="${l.id}">🔒 Révoquer</button></div></div><div class="card"><div class="card-title">📚 Modules (${done}/${mk.length})</div>${mk.map(k=>{const u=l.hasFullAccess||(l.unlockedModules||[]).includes(k);const d=l.exercises?.[k];return `<div class="row" style="cursor:default;padding:10px"><div class="avatar" style="background:${d?'var(--v)':u?'var(--b)':'var(--m)'}">${d?'✓':u?'🔓':'🔒'}</div><div class="info"><b>Module ${k}</b><small>${U.esc(s.modules[k].title)}</small></div><div class="flex"><button class="btn btn-sm ${u?'btn-rouge':'btn-or'}" data-action="admin.toggleUnlock" data-id="${l.id}" data-k="${k}">${u?'Lock':'Unlock'}</button></div></div>`;}).join('')}</div><div class="card"><div class="card-title">💳 Paiements (${U.money(l.amountPaid)})</div>${pays.map(p=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--br)"><span style="font-size:13px">${U.date(p.date)} · ${U.esc(p.type)}</span><b style="color:var(--v)">${U.money(p.amount)}</b></div>`).join('')||'<p class="text-muted">Aucun</p>'}</div>`;this.go('detail');},
toggleUnlock(id,k){const l=State.learner(id);if(!l)return;if(l.hasFullAccess)return To.show('Pack actif','error');Access.toggleModule(id,k);this.openDetail(id);},
activate(id){Dg.confirm('Activer Pack ?',()=>{Access.activateManually(id);To.show('✅ Activé','success');this.openDetail(id);},{yes:'Activer'});},
deactivate(id){Dg.confirm('Révoquer TOUS ?',()=>{Access.deactivate(id);To.show('✅ Révoqué','success');this.openDetail(id);},{danger:true,yes:'Révoquer'});},
cms(){const s=State.get();const io=State.isOwner();const co=State.currentCoAdmin();const mm=co?co.moduleIds||[]:Object.keys(s.modules).map(Number);const mk=Object.keys(s.modules).map(Number).sort((a,b)=>a-b).filter(k=>io||mm.includes(k));document.getElementById('av-cms').innerHTML=`<div class="info-box">📚 Gérez le programme</div><button class="btn btn-vert btn-block mb-12" data-action="admin.newModule">➕ Créer module</button>${mk.map(k=>{const m=s.modules[k];return `<div class="card" style="border-left:4px solid var(--b2)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div><b style="color:var(--b)">M${k} · ${U.esc(m.title)}</b><br><small class="text-muted">${m.lessons.length} leçons</small></div><div class="flex"><button class="btn btn-sm btn-outline" data-action="admin.editModule" data-mid="${k}">✎</button><button class="btn btn-sm btn-rouge" data-action="admin.delModule" data-mid="${k}">🗑️</button></div></div><div style="background:var(--bg);border-radius:8px;padding:10px;margin-bottom:8px">${m.lessons.map((ls,idx)=>`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--br)"><div style="font-size:13px;flex:1"><b>L${idx+1} :</b> ${U.esc(ls.h)} ${ls.video?'🎬':''} ${ls.parts?'📑':''}</div><div class="flex"><button class="btn btn-sm btn-outline" data-action="admin.editLesson" data-mid="${k}" data-idx="${idx}" style="padding:2px 6px;font-size:11px">✎</button><button class="btn btn-sm btn-rouge" data-action="admin.delLesson" data-mid="${k}" data-idx="${idx}" style="padding:2px 6px;font-size:11px">✕</button></div></div>`).join('')}</div><button class="btn btn-sm btn-or btn-block" data-action="admin.addLesson" data-mid="${k}">➕ Leçon</button></div>`;}).join('')}`;},
newModule(){Md.open(`<div class="modal-title">➕ Module<button class="modal-close" data-action="modal.close">✕</button></div><div class="form-group"><label class="form-label">Titre *</label><input class="form-input" id="mod_title"></div><div class="form-group"><label class="form-label">Objectif</label><textarea class="form-textarea" id="mod_obj"></textarea></div><button class="btn btn-vert btn-block" data-action="admin.saveNewModule">💾 Créer</button>`);},
saveNewModule(){const t=document.getElementById('mod_title').value.trim();const o=document.getElementById('mod_obj').value.trim();if(!t)return To.show('⚠️ Titre','error');const s=State.get();const ks=Object.keys(s.modules).map(Number);const nid=ks.length?Math.max(...ks)+1:1;s.modules[nid]={title:t,objectif:o,lessons:[],exercice:'',revenu:''};State.save();Md.close();To.show('✅ Créé','success');this.cms();},
editModule(mid){const s=State.get();const m=s.modules[mid];if(!m)return;Md.open(`<div class="modal-title">✎ M${mid}<button class="modal-close" data-action="modal.close">✕</button></div><div class="form-group"><label class="form-label">Titre</label><input class="form-input" id="mod_title" value="${U.esc(m.title)}"></div><div class="form-group"><label class="form-label">Objectif</label><textarea class="form-textarea" id="mod_obj">${U.esc(m.objectif||'')}</textarea></div><div class="form-group"><label class="form-label">Exercice</label><textarea class="form-textarea" id="mod_exo">${U.esc(m.exercice||'')}</textarea></div><div class="form-group"><label class="form-label">Revenus</label><input class="form-input" id="mod_rev" value="${U.esc(m.revenu||'')}"></div><button class="btn btn-vert btn-block" data-action="admin.saveModule" data-mid="${mid}">💾</button>`);},
saveModule(mid){const s=State.get();const m=s.modules[mid];if(!m)return;m.title=document.getElementById('mod_title').value.trim()||m.title;m.objectif=document.getElementById('mod_obj').value.trim();m.exercice=document.getElementById('mod_exo').value.trim();m.revenu=document.getElementById('mod_rev').value.trim();State.save();Md.close();To.show('✅','success');this.cms();},
delModule(mid){Dg.confirm(`Supprimer M${mid} ?`,()=>{const s=State.get();delete s.modules[mid];State.save();To.show('🗑️','success');this.cms();},{danger:true,yes:'Supprimer'});},
_addPart(title='',content='',prompt=''){const c=document.getElementById('ls_parts');if(!c)return;const r=document.createElement('div');r.className='ls-part-row';r.innerHTML=`<input class="form-input mb-8" placeholder="Titre" data-part="title" value="${U.esc(title)}"><textarea class="form-textarea mb-8" placeholder="Contenu" data-part="content">${U.esc(content)}</textarea><input class="form-input mb-8" placeholder="Prompt" data-part="prompt" value="${U.esc(prompt)}"><button type="button" class="btn btn-sm btn-rouge" onclick="this.closest('.ls-part-row').remove()">✕</button>`;c.appendChild(r);},
addLesson(mid){Md.open(`<div class="modal-title">➕ Leçon M${mid}<button class="modal-close" data-action="modal.close">✕</button></div><div class="form-group"><label class="form-label">Titre *</label><input class="form-input" id="ls_title"></div><div class="form-group"><label class="form-label">🎬 Vidéo URL</label><input class="form-input" id="ls_video" placeholder="https://youtu.be/..."></div><div class="form-group"><label class="form-label">Contenu</label><textarea class="form-textarea" id="ls_content" style="min-height:100px"></textarea></div><div class="form-group"><label class="form-label">Prompt</label><textarea class="form-textarea" id="ls_prompt"></textarea></div><div class="form-group"><label class="form-label">📑 Sous-parties</label><div id="ls_parts"></div><button type="button" class="btn btn-sm btn-outline btn-block mt-8" onclick="AdminUI._addPart()">➕ Sous-partie</button></div><button class="btn btn-vert btn-block" data-action="admin.saveNewLesson" data-mid="${mid}">💾</button>`);},
saveNewLesson(mid){const t=document.getElementById('ls_title').value.trim();if(!t)return To.show('⚠️ Titre','error');const v=document.getElementById('ls_video').value.trim();const c=document.getElementById('ls_content').value.trim();const p=document.getElementById('ls_prompt').value.trim();const parts=Array.from(document.querySelectorAll('.ls-part-row')).map(r=>({title:r.querySelector('[data-part="title"]').value.trim(),content:r.querySelector('[data-part="content"]').value.trim(),prompt:r.querySelector('[data-part="prompt"]').value.trim()||undefined})).filter(x=>x.title||x.content);const s=State.get();const m=s.modules[mid];if(!m)return;m.lessons.push({h:t,p:c||undefined,prompt:p||undefined,video:v||undefined,parts:parts.length?parts:undefined});State.save();Md.close();To.show('✅','success');this.cms();},
editLesson(mid,idx){const s=State.get();const m=s.modules[mid];if(!m||!m.lessons[idx])return;const ls=m.lessons[idx];Md.open(`<div class="modal-title">✎ L${Number(idx)+1}<button class="modal-close" data-action="modal.close">✕</button></div><div class="form-group"><label class="form-label">Titre</label><input class="form-input" id="ls_title" value="${U.esc(ls.h)}"></div><div class="form-group"><label class="form-label">🎬 Vidéo</label><input class="form-input" id="ls_video" value="${U.esc(ls.video||'')}"></div><div class="form-group"><label class="form-label">Contenu</label><textarea class="form-textarea" id="ls_content" style="min-height:100px">${U.esc(ls.p||'')}</textarea></div><div class="form-group"><label class="form-label">Prompt</label><textarea class="form-textarea" id="ls_prompt">${U.esc(ls.prompt||'')}</textarea></div><div class="form-group"><label class="form-label">📑 Sous-parties</label><div id="ls_parts"></div><button type="button" class="btn btn-sm btn-outline btn-block mt-8" onclick="AdminUI._addPart()">➕</button></div><button class="btn btn-vert btn-block" data-action="admin.saveLesson" data-mid="${mid}" data-idx="${idx}">💾</button>`);(ls.parts||[]).forEach(p=>this._addPart(p.title,p.content,p.prompt));},
saveLesson(mid,idx){const s=State.get();const m=s.modules[mid];if(!m||!m.lessons[idx])return;const parts=Array.from(document.querySelectorAll('.ls-part-row')).map(r=>({title:r.querySelector('[data-part="title"]').value.trim(),content:r.querySelector('[data-part="content"]').value.trim(),prompt:r.querySelector('[data-part="prompt"]').value.trim()||undefined})).filter(x=>x.title||x.content);m.lessons[idx]={h:document.getElementById('ls_title').value.trim(),p:document.getElementById('ls_content').value.trim()||undefined,prompt:document.getElementById('ls_prompt').value.trim()||undefined,video:document.getElementById('ls_video').value.trim()||undefined,parts:parts.length?parts:undefined};State.save();Md.close();To.show('✅','success');this.cms();},
delLesson(mid,idx){Dg.confirm('Supprimer ?',()=>{const s=State.get();const m=s.modules[mid];if(!m)return;m.lessons.splice(idx,1);State.save();this.cms();},{danger:true,yes:'Supprimer'});},
subs(){const s=State.get();const io=State.isOwner();const co=State.currentCoAdmin();const mm=co?co.moduleIds||[]:Object.keys(s.modules).map(Number);let subs=[...s.submissions].sort((a,b)=>new Date(b.date)-new Date(a.date));if(!io)subs=subs.filter(x=>mm.includes(x.moduleId));document.getElementById('av-submissions').innerHTML=subs.length?subs.map(x=>{const l=State.learner(x.learnerId);return `<div class="submission ${x.status}"><div class="s-head"><div><b>${U.esc(l?.name||'?')}</b><br><small class="text-muted">M${x.moduleId} · ${U.dateTime(x.date)}</small></div><span class="badge ${x.status==='approved'?'badge-vert':x.status==='rejected'?'badge-rouge':'badge-or'}">${x.status}</span></div><div class="s-content">${U.esc(x.text)}</div>${x.feedback?`<div class="s-feedback ${x.status==='approved'?'approved':''}">${U.esc(x.feedback)}</div>`:''}${x.status==='pending'?`<div class="flex mt-12"><button class="btn btn-vert btn-block btn-sm" data-action="admin.approveSub" data-id="${x.id}">✅</button><button class="btn btn-rouge btn-block btn-sm" data-action="admin.rejectSub" data-id="${x.id}">✕</button></div>`:''}</div>`;}).join(''):'<div class="empty"><div class="empty-icon">📝</div><p>Aucun</p></div>';},
approveSub(id){const s=State.get();const x=s.submissions.find(v=>v.id===id);if(!x)return;x.status='approved';const l=State.learner(x.learnerId);if(l){l.exercises=l.exercises||{};l.exercises[x.moduleId]=true;}State.save();To.show('✅','success');this.subs();},
rejectSub(id){Dg.prompt('Motif :',(fb)=>{const s=State.get();const x=s.submissions.find(v=>v.id===id);if(!x)return;x.status='rejected';x.feedback=fb;State.save();this.subs();},{title:'Rejeter'});},
msgs(){const s=State.get();const lm=s.learners.map(l=>{const ms=s.messages.filter(m=>m.learnerId===l.id);const un=ms.filter(m=>m.from==='learner'&&!m.read).length;const last=ms.length?ms[ms.length-1]:null;return{learner:l,unread:un,last};}).sort((a,b)=>{if(a.unread!==b.unread)return b.unread-a.unread;return new Date(b.last?.date||0)-new Date(a.last?.date||0);});document.getElementById('av-messages').innerHTML=`<div class="card"><div class="card-title">📢 Annonce</div><textarea class="form-textarea" id="ann_text" style="min-height:70px"></textarea><button class="btn btn-primary btn-block mt-8" data-action="admin.sendAnn">📢 Envoyer</button></div><div class="card-title" style="margin-top:16px">💬 Conversations</div>${lm.length?lm.map(({learner,unread,last})=>`<div class="row" data-action="admin.openChat" data-id="${learner.id}">${U.avatar(learner)}<div class="info"><b>${U.esc(learner.name)} ${unread?`<span class="badge badge-rouge">${unread}</span>`:''}</b><small>${last?U.esc((last.from==='admin'?'👨‍💼 ':'')+(last.text||'').substring(0,40)):'Aucun'}</small></div><span style="color:var(--m)">›</span></div>`).join(''):'<div class="empty"><p>Aucun</p></div>'}`;},
sendAnn(){const txt=document.getElementById('ann_text').value.trim();if(!txt)return To.show('⚠️','error');const s=State.get();s.messages.push({id:U.uid(),learnerId:null,from:'admin',text:txt,date:new Date().toISOString(),read:false});State.save();To.show('📢','success');this.msgs();},
openChat(id){this._chatId=id;const s=State.get();const l=State.learner(id);if(!l)return;const ms=s.messages.filter(m=>m.learnerId===id).sort((a,b)=>new Date(a.date)-new Date(b.date));s.messages.forEach(m=>{if(m.learnerId===id&&m.from==='learner')m.read=true;});State.save();document.getElementById('av-chat').innerHTML=`<button class="back-btn" data-action="admin.go" data-tab="messages">← Retour</button><div class="detail-header" style="display:flex;align-items:center;gap:12px">${U.avatar(l,'width:48px;height:48px;font-size:20px')}<div><h2 style="font-size:17px">${U.esc(l.name)}</h2><p>${U.esc(l.phone||'')}</p></div></div><div class="card list-box" id="adminChatList">${ms.length?ms.map(m=>`<div class="msg ${m.from==='admin'?'msg-admin':'msg-learner'}"><div class="msg-meta">${m.from==='admin'?'👨‍💼':'🎓'} · ${U.dateTime(m.date)}</div><div class="msg-text">${U.esc(m.text)}</div></div>`).join(''):'<p class="text-muted">Aucun</p>'}</div><div class="msg-input-bar" style="bottom:0;position:sticky"><input class="form-input" id="adminChatInput" placeholder="Répondre..." style="flex:1"><button class="btn btn-primary" data-action="admin.sendChat">➤</button></div>`;this.go('chat');setTimeout(()=>{const x=document.getElementById('adminChatList');if(x)x.scrollTop=x.scrollHeight;},50);},
sendChat(){const id=this._chatId;const l=State.learner(id);if(!l)return;const txt=document.getElementById('adminChatInput')?.value.trim();if(!txt)return;const s=State.get();s.messages.push({id:U.uid(),learnerId:id,from:'admin',text:txt,date:new Date().toISOString(),read:false});State.save();this.openChat(id);},
commTab(t){this._commTab=t;this.comm();},
comm(){const isFeed=this._commTab==='feed';document.getElementById('av-community').innerHTML=`<div class="chip-row"><div class="chip ${isFeed?'active':''}" data-action="admin.commTab" data-tab="feed">📰 Fil</div><div class="chip ${!isFeed?'active':''}" data-action="admin.commTab" data-tab="market">🛒 Marketplace</div></div>${isFeed?this.feed():this.market()}`;},
feed(){const s=State.get();const posts=[...s.community].sort((a,b)=>new Date(b.date)-new Date(a.date));const me=State.currentAdmin()?.name||'Admin';return `<div class="card"><div class="card-title">📢 Publier</div><textarea class="form-textarea" id="comm_text" style="min-height:70px"></textarea><button class="btn btn-primary btn-block mt-8" data-action="admin.sendComm">📤 Publier</button></div>${posts.length?posts.map(m=>{const liked=(m.likes||[]).includes(me);return `<div class="post-card"><div class="post-head"><div class="post-author"><div class="avatar" style="width:32px;height:32px;font-size:14px">${U.esc(m.name).charAt(0)}</div>${U.esc(m.name)}</div><small class="text-muted">${U.dateTime(m.date)}</small></div><div class="post-content">${U.esc(m.text)}</div><div class="post-actions"><button class="post-btn ${liked?'liked':''}" data-action="community.like" data-id="${m.id}" data-author="${U.esc(me)}">❤️ ${(m.likes||[]).length}</button><button class="post-btn" data-action="community.toggleReply" data-id="${m.id}">💬 ${(m.replies||[]).length}</button><button class="post-btn" data-action="admin.delComm" data-id="${m.id}" style="margin-left:auto;color:var(--r)">🗑️</button></div>${(m.replies&&m.replies.length)?`<div class="replies-box">${m.replies.map(r=>`<div class="reply"><b>${U.esc(r.name)}</b><br>${U.esc(r.text)}</div>`).join('')}</div>`:''}<div class="reply-input-box" id="reply_box_${m.id}" style="display:none"><input type="text" id="reply_input_${m.id}" placeholder="Répondre..."><button class="btn btn-sm btn-primary" data-action="community.reply" data-id="${m.id}" data-author="${U.esc(me)}">➤</button></div></div>`;}).join(''):'<div class="empty"><div class="empty-icon">📰</div><p>Aucune</p></div>'}`;},
market(){const s=State.get();const items=[...s.marketplace].sort((a,b)=>new Date(b.date)-new Date(a.date));return `<div class="info-box">🛒 Modération</div>${items.length?items.map(p=>{const l=State.learner(p.sellerId);return `<div class="card" style="border-left:4px solid ${p.approved?'var(--v)':'var(--o)'}"><div style="display:flex;gap:10px;margin-bottom:8px">${p.image?`<img src="${p.image}" style="width:80px;height:80px;object-fit:cover;border-radius:8px">`:`<div style="width:80px;height:80px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:32px">📦</div>`}<div style="flex:1"><b>${U.esc(p.title)}</b><div style="color:var(--o);font-weight:800">${U.money(p.price)}</div><small class="text-muted">${U.esc(l?.name||p.sellerName||'?')}</small></div></div><p style="font-size:13px;color:var(--m);margin-bottom:10px">${U.esc(p.description||'')}</p><div class="flex">${!p.approved?`<button class="btn btn-vert btn-sm btn-block" data-action="admin.approveMarket" data-id="${p.id}">✅</button>`:''}<button class="btn btn-rouge btn-sm btn-block" data-action="admin.delMarket" data-id="${p.id}">🗑️</button></div></div>`;}).join(''):'<div class="empty"><div class="empty-icon">🛒</div><p>Aucun</p></div>'}`;},
sendComm(){const t=document.getElementById('comm_text').value.trim();if(!t)return To.show('⚠️','error');const s=State.get();s.community.push({id:U.uid(),from:'coach',learnerId:null,name:State.currentAdmin()?.name||'Coach',text:t,date:new Date().toISOString(),likes:[],replies:[]});State.save();To.show('✅','success');this.comm();},
delComm(id){Dg.confirm('Supprimer ?',()=>{const s=State.get();s.community=s.community.filter(c=>c.id!==id);State.save();this.comm();},{danger:true,yes:'Oui'});},
approveMarket(id){const s=State.get();const p=s.marketplace.find(x=>x.id===id);if(!p)return;p.approved=true;State.save();To.show('✅','success');this.comm();},
delMarket(id){Dg.confirm('Supprimer ?',()=>{const s=State.get();s.marketplace=s.marketplace.filter(x=>x.id!==id);State.save();this.comm();},{danger:true,yes:'Oui'});},
pays(){const s=State.get();if(!State.isOwner()){document.getElementById('av-payments').innerHTML='<div class="empty"><p>Admin principal</p></div>';return;}const pending=s.learners.filter(l=>l.accessStatus==='payment_submitted'&&l.paymentProof);const pays=[...s.payments].sort((a,b)=>new Date(b.date)-new Date(a.date));document.getElementById('av-payments').innerHTML=`<button class="btn btn-vert btn-block mb-12" data-action="admin.manual">➕ Paiement manuel</button>${pending.length?`<div class="card" style="border-left:4px solid var(--o)"><div class="card-title">⏳ À valider (${pending.length})</div>${pending.map(l=>{const p=l.paymentProof;return `<div style="background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #fde68a"><b>${U.esc(l.name)}</b><div style="font-size:13px;margin:8px 0"><div>${U.money(p.amount||0)}</div><div>${p.type==='pack'?'Pack':'M'+p.moduleId}</div></div><div class="flex"><button class="btn btn-vert btn-sm btn-block" data-action="admin.approvePay" data-id="${l.id}">✅</button><button class="btn btn-rouge btn-sm btn-block" data-action="admin.rejectPay" data-id="${l.id}">❌</button></div></div>`;}).join('')}</div>`:''}<div class="card"><div class="card-title">📊 Historique (${pays.length})</div>${pays.map(p=>{const l=State.learner(p.learnerId);return `<div style="padding:10px 0;border-bottom:1px solid var(--br)"><div style="display:flex;justify-content:space-between"><b>${U.esc(l?.name||'?')}</b><b style="color:var(--v)">${U.money(p.amount)}</b></div><div class="text-muted" style="font-size:11px">${U.date(p.date)} · ${U.esc(p.type)}</div></div>`;}).join('')||'<p class="text-muted">Aucun</p>'}</div>`;},
manual(){const s=State.get();if(!s.learners.length)return To.show('Aucun apprenant','error');Md.open(`<div class="modal-title">💰 Paiement Manuel<button class="modal-close" data-action="modal.close">✕</button></div><div class="form-group"><label class="form-label">Apprenant</label><select class="form-select" id="mp_learner">${s.learners.map(l=>`<option value="${l.id}">${U.esc(l.name)}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Type</label><select class="form-select" id="mp_type"><option value="pack">Pack ${U.money(s.settings.packPrice)}</option><option value="module">Module ${U.money(s.settings.modulePrice)}</option></select></div><div class="form-group" id="mp_module_box" style="display:none"><label class="form-label">Module</label><select class="form-select" id="mp_mid">${Object.keys(s.modules).map(k=>`<option value="${k}">M${k} - ${U.esc(s.modules[k].title)}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Montant *</label><input class="form-input" id="mp_amount" type="number"></div><div class="form-group"><label class="form-label">Méthode</label><select class="form-select" id="mp_method"><option>Espèces</option><option>Orange Money</option><option>MTN MoMo</option></select></div><button class="btn btn-vert btn-block" data-action="admin.saveManual">💾 Valider</button>`);document.getElementById('mp_type').addEventListener('change',(e)=>{document.getElementById('mp_module_box').style.display=e.target.value==='module'?'block':'none';});},
saveManual(){const lid=document.getElementById('mp_learner').value;const t=document.getElementById('mp_type').value;const mid=document.getElementById('mp_mid').value;const amount=Number(document.getElementById('mp_amount').value);const method=document.getElementById('mp_method').value;if(!amount||amount<=0)return To.show('⚠️ Montant','error');Access.approvePayment(lid,t,mid,method,amount);To.show('✅ Enregistré','success');Md.close();this.pays();},
approvePay(id){const l=State.learner(id);if(!l||!l.paymentProof)return;const p=l.paymentProof;Dg.confirm(`Valider ${U.money(p.amount)} ?`,()=>{Access.approvePayment(id,p.type,p.moduleId,p.method);To.show('✅','success');this.pays();});},
rejectPay(id){Dg.prompt('Motif :',(r)=>{Access.rejectPayment(id,r);To.show('Rejeté','info');this.pays();},{title:'Rejeter'});},
settings(){const s=State.get();if(!State.isOwner()){document.getElementById('av-settings').innerHTML='<div class="empty"><p>Admin principal</p></div>';return;}document.getElementById('av-settings').innerHTML=`<div class="card"><div class="card-title">💰 Tarifs</div><div class="form-group"><label class="form-label">Prix Pack</label><input class="form-input" id="setPackPrice" type="number" value="${s.settings.packPrice}"></div><div class="form-group"><label class="form-label">Lien Pack</label><input class="form-input" id="setPackUrl" value="${U.esc(s.settings.chariowPackUrl||'')}"></div><div class="form-group"><label class="form-label">Prix Module</label><input class="form-input" id="setModulePrice" type="number" value="${s.settings.modulePrice}"></div><div class="form-group"><label class="form-label">Lien Module</label><input class="form-input" id="setModuleUrl" value="${U.esc(s.settings.chariowModuleUrl||'')}"></div><button class="btn btn-primary btn-block" data-action="admin.savePricing">💾</button></div><div class="card"><div class="card-title">👨‍🏫 Coach</div><div class="form-group"><label class="form-label">Nom</label><input class="form-input" id="setCoachName" value="${U.esc(s.settings.coachName)}"></div><div class="form-group"><label class="form-label">WhatsApp</label><input class="form-input" id="setCoachWA" value="${U.esc(s.settings.coachWhatsApp)}"></div><button class="btn btn-primary btn-block" data-action="admin.saveCoach">💾</button></div><div class="card"><div class="card-title">🔐 Mot de passe</div><input class="form-input" id="setPwd" type="password" placeholder="6+ car. mixte"><button class="btn btn-primary btn-block mt-8" data-action="admin.savePwd">💾</button></div><div class="card"><div class="card-title">☁️ Cloud</div><div id="syncStatus" style="font-size:13px;padding:10px;background:var(--bg);border-radius:8px;margin-bottom:10px">🔄 Test…</div><button class="btn btn-or btn-block" data-action="admin.pullCloud">⬇️ Pull</button><button class="btn btn-vert btn-block mt-8" data-action="admin.pushCloud">⬆️ Push</button></div>`;setTimeout(()=>this.testSync(),100);},
async testSync(){const el=document.getElementById('syncStatus');if(!el)return;if(!window.SupaSync){el.textContent='❌';return;}const r=await SupaSync.test();el.innerHTML=r.msg;},
async pullCloud(){const r=await St.loadFromCloud();if(!r)return To.show('⚠️','error');const d=State.get();Object.keys(r).forEach(k=>{d[k]=r[k];});State.save();To.show('✅','success');setTimeout(()=>location.reload(),800);},
async pushCloud(){try{await SupaSync.save(State.get());To.show('✅','success');}catch{To.show('❌','error');}},
savePricing(){const s=State.get();s.settings.packPrice=Number(document.getElementById('setPackPrice').value)||20000;s.settings.chariowPackUrl=document.getElementById('setPackUrl').value.trim();s.settings.modulePrice=Number(document.getElementById('setModulePrice').value)||5000;s.settings.chariowModuleUrl=document.getElementById('setModuleUrl').value.trim();State.save();To.show('✅','success');},
saveCoach(){const s=State.get();s.settings.coachName=document.getElementById('setCoachName').value.trim()||'Coach';s.settings.coachWhatsApp=document.getElementById('setCoachWA').value.trim();State.save();To.show('✅','success');},
async savePwd(){const p=document.getElementById('setPwd').value;if(!Cr.isStrong(p))return To.show('❌ 6+ mixte','error');const s=State.get();s.settings.masterPasswordHash=await Cr.hash(p);State.save();To.show('✅','success');}
};

const LearnerUI={
tab:'home',_commTab:'feed',
open(){const l=State.currentLearner();if(!l)return Auth.logout();document.body.classList.add('learner-mode');document.getElementById('learnerWho').textContent=l.name;Router.go('s-learner');this.go('home');Nw.refresh();},
go(tab){this.tab=tab;document.querySelectorAll('#s-learner .view').forEach(v=>v.classList.remove('active'));const v=document.getElementById('lv-'+tab);if(v)v.classList.add('active');document.querySelectorAll('#s-learner .nav-item').forEach(n=>n.classList.remove('active'));document.querySelectorAll('#s-learner .nav-item').forEach(n=>{if(n.dataset.tab===tab)n.classList.add('active');});window.scrollTo(0,0);this.render(tab);this.badges();},
showTab(t){document.querySelectorAll('#s-learner .view').forEach(v=>v.classList.remove('active'));const v=document.getElementById('lv-'+t);if(v)v.classList.add('active');},
badges(){const l=State.currentLearner();if(!l)return;const s=State.get();const un=s.messages.filter(m=>m.from==='admin'&&(m.learnerId===l.id||m.learnerId===null)&&!m.read).length;const b=document.getElementById('learnerBadgeMsg');if(b){b.textContent=un;b.style.display=un>0?'block':'none';}},
render(t){const r={home:()=>this.home(),modules:()=>this.mods(),submissions:()=>this.subs(),messages:()=>this.msgs(),community:()=>this.comm(),profile:()=>this.profile()};try{r[t]?.();}catch(e){console.error(e);}},
home(){if(State.get().currentUser?.role!=='learner')return Auth.logout();const l=State.currentLearner();const s=State.get();const isA=Access.isActive(l);const mk=Object.keys(s.modules).map(Number).sort((a,b)=>a-b);const done=Object.values(l.exercises||{}).filter(Boolean).length;const pct=mk.length?Math.round((done/mk.length)*100):0;const st=Streak.get(l.id);document.getElementById('lv-home').innerHTML=`<div class="stats"><div class="stat hl"><div class="stat-label">Progression</div><div class="stat-value">${pct}%</div></div><div class="stat"><div class="stat-label">Modules</div><div class="stat-value">${done}/${mk.length}</div></div><div class="stat"><div class="stat-label">Série</div><div class="stat-value">${st.count} j</div></div><div class="stat"><div class="stat-label">Accès</div><div class="stat-value" style="font-size:14px">${l.hasFullAccess?'✅ Pack':isA?'🔓':'🔒'}</div></div></div>${!isA?`<div class="card" style="border-left:4px solid var(--o);background:#fffbeb"><div class="card-title">🔓 Débloquer</div><button class="btn btn-or btn-block mb-8" data-action="learner.buyPack">💰 Pack · ${U.money(s.settings.packPrice)}</button><button class="btn btn-outline btn-block" data-action="learner.buyModule" data-mid="${mk[0]||1}">📚 Module · ${U.money(s.settings.modulePrice)}</button></div>`:''}<div class="card"><div class="card-title">📊 Progression</div><div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div></div><div class="card"><div class="card-title">🎯 Prochaines</div>${mk.slice(0,3).map(k=>{const u=Access.isModuleUnlocked(l,k);const d=l.exercises?.[k];return `<div class="row" data-action="learner.openModule" data-mid="${k}" style="opacity:${u?1:0.6}"><div class="avatar" style="background:${d?'var(--v)':u?'var(--b)':'var(--m)'}">${d?'✓':u?k:'🔒'}</div><div class="info"><b>M${k} · ${U.esc(s.modules[k].title)}</b><small>${d?'Terminé':u?'À découvrir':'Débloquer'}</small></div><span style="color:var(--m)">›</span></div>`;}).join('')}</div>`;},
mods(){const l=State.currentLearner();const s=State.get();const mk=Object.keys(s.modules).map(Number).sort((a,b)=>a-b);document.getElementById('lv-modules').innerHTML=mk.map(k=>{const m=s.modules[k];const u=Access.isModuleUnlocked(l,k);const d=l.exercises?.[k];const hq=(s.quizzes[k]||[]).length>0;const sc=s.quizScores[l.id]?.[k];return `<div class="mod-card ${d?'done':''} ${!u?'locked':''}" data-action="learner.openModule" data-mid="${k}"><div class="num">${d?'✓':!u?'🔒':k}</div><div style="flex:1"><h3>${U.esc(m.title)}</h3><small>${m.lessons.length} leçons ${hq?'· Quiz':''} ${sc?`· ${sc.score}/${sc.total}`:''}</small></div></div>`;}).join('');},
openModule(mid){const l=State.currentLearner();const s=State.get();const m=s.modules[mid];if(!m)return;const u=Access.isModuleUnlocked(l,mid);const d=l.exercises?.[mid];const hq=(s.quizzes[mid]||[]).length>0;document.getElementById('lv-module-detail').innerHTML=`<button class="back-btn" data-action="learner.go" data-tab="modules">← Retour</button><div class="detail-header"><h2>M${mid} · ${U.esc(m.title)}</h2><p>${U.esc(m.objectif||'')}</p></div>${!u?`<div class="warning-box">🔒 Verrouillé<br><button class="btn btn-or btn-sm mt-8" data-action="learner.buyModule" data-mid="${mid}">Débloquer · ${U.money(s.settings.modulePrice)}</button></div>`:''}${m.lessons.map((ls,idx)=>{const ph=(ls.parts&&ls.parts.length)?ls.parts.map((p,i)=>`<div style="background:var(--bg);border-radius:10px;padding:12px;margin:8px 0;border-left:3px solid var(--b2)"><b style="color:var(--b2);font-size:13px;display:block;margin-bottom:4px">${U.esc(p.title||'SP'+(i+1))}</b><p style="font-size:14px;line-height:1.6;white-space:pre-line">${U.esc(p.content||'')}</p>${p.prompt?`<div class="prompt-box" style="margin-top:8px">${U.esc(p.prompt)}</div>`:''}</div>`).join(''):'';return `<div class="lesson"><h4>L${idx+1} : ${U.esc(ls.h)}</h4>${U.video(ls.video)}${ls.p?`<p>${U.esc(ls.p)}</p>`:''}${ls.prompt?`<div class="prompt-box">${U.esc(ls.prompt)}</div>`:''}${ph}</div>`;}).join('')}${m.exercice?`<div class="exercise-box"><b>🎯 Exercice</b>${U.esc(m.exercice)}</div>`:''}${m.revenu?`<div class="revenu-box">💰 ${U.esc(m.revenu)}</div>`:''}${u&&!d?`<button class="btn btn-vert btn-block mt-12" data-action="learner.submit" data-mid="${mid}">📤 Soumettre</button>`:''}${d?`<div class="info-box mt-12">✅ Terminé</div>`:''}${hq&&u?`<button class="btn btn-or btn-block mt-8" data-action="quiz.start" data-module="${mid}">📝 Quiz</button>`:''}`;this.showTab('module-detail');},
submit(mid){Dg.prompt('Décrivez votre travail :',(txt)=>{if(!txt)return To.show('⚠️','error');const s=State.get();const l=State.currentLearner();s.submissions.push({id:U.uid(),learnerId:l.id,moduleId:Number(mid),text:txt,status:'pending',date:new Date().toISOString()});State.save();To.show('✅','success');this.openModule(mid);},{title:'Soumettre',yes:'Envoyer'});},
subs(){const l=State.currentLearner();const s=State.get();const my=s.submissions.filter(x=>x.learnerId===l.id).sort((a,b)=>new Date(b.date)-new Date(a.date));document.getElementById('lv-submissions').innerHTML=my.length?my.map(x=>`<div class="submission ${x.status}"><div class="s-head"><div><b>M${x.moduleId}</b><br><small class="text-muted">${U.dateTime(x.date)}</small></div><span class="badge ${x.status==='approved'?'badge-vert':x.status==='rejected'?'badge-rouge':'badge-or'}">${x.status==='approved'?'✅':x.status==='rejected'?'❌':'⏳'}</span></div><div class="s-content">${U.esc(x.text)}</div>${x.feedback?`<div class="s-feedback ${x.status==='approved'?'approved':''}">${U.esc(x.feedback)}</div>`:''}</div>`).join(''):'<div class="empty"><div class="empty-icon">📝</div><p>Aucun</p></div>';},
msgs(){const l=State.currentLearner();const s=State.get();const ms=s.messages.filter(m=>(m.learnerId===l.id&&(m.from==='admin'||m.from==='learner'))||(m.learnerId===null&&m.from==='admin')).sort((a,b)=>new Date(a.date)-new Date(b.date));s.messages.forEach(m=>{if(m.from==='admin'&&(m.learnerId===l.id||m.learnerId===null))m.read=true;});State.save();document.getElementById('lv-messages').innerHTML=`<div class="card list-box" id="learnerChatList">${ms.length?ms.map(m=>{const a=m.learnerId===null;const c=a?'msg-announcement':(m.from==='admin'?'msg-admin':'msg-learner');return `<div class="msg ${c}"><div class="msg-meta">${a?'📢':m.from==='admin'?'👨‍💼':'🎓'} · ${U.dateTime(m.date)}</div><div class="msg-text">${U.esc(m.text)}</div></div>`;}).join(''):'<p class="text-muted">Aucun</p>'}</div><div class="msg-input-bar" style="position:sticky;bottom:0"><input class="form-input" id="learnerChatInput" placeholder="Message..." style="flex:1"><button class="btn btn-primary" data-action="learner.sendMsg">➤</button></div>`;},
sendMsg(){const l=State.currentLearner();const txt=document.getElementById('learnerChatInput')?.value.trim();if(!txt)return;const s=State.get();s.messages.push({id:U.uid(),learnerId:l.id,from:'learner',text:txt,date:new Date().toISOString(),read:false});State.save();this.msgs();},
commTab(t){this._commTab=t;this.comm();},
comm(){const isF=this._commTab==='feed';document.getElementById('lv-community').innerHTML=`<div class="chip-row"><div class="chip ${isF?'active':''}" data-action="learner.commTab" data-tab="feed">📰 Fil</div><div class="chip ${!isF?'active':''}" data-action="learner.commTab" data-tab="market">🛒 Market</div></div>${isF?this.feed():this.market()}`;},
feed(){const s=State.get();const l=State.currentLearner();const posts=[...s.community].sort((a,b)=>new Date(b.date)-new Date(a.date));return posts.length?posts.map(m=>{const liked=(m.likes||[]).includes(l.name);return `<div class="post-card"><div class="post-head"><div class="post-author"><div class="avatar" style="width:32px;height:32px;font-size:14px">${U.esc(m.name).charAt(0)}</div>${U.esc(m.name)}${m.from==='coach'?'<span class="badge badge-bleu" style="font-size:9px;margin-left:4px">COACH</span>':''}</div><small class="text-muted">${U.dateTime(m.date)}</small></div><div class="post-content">${U.esc(m.text)}</div><div class="post-actions"><button class="post-btn ${liked?'liked':''}" data-action="community.like" data-id="${m.id}" data-author="${U.esc(l.name)}">❤️ ${(m.likes||[]).length}</button><button class="post-btn" data-action="community.toggleReply" data-id="${m.id}">💬 ${(m.replies||[]).length}</button></div>${(m.replies&&m.replies.length)?`<div class="replies-box">${m.replies.map(r=>`<div class="reply"><b>${U.esc(r.name)}</b><br>${U.esc(r.text)}</div>`).join('')}</div>`:''}<div class="reply-input-box" id="reply_box_${m.id}" style="display:none"><input type="text" id="reply_input_${m.id}" placeholder="Répondre..."><button class="btn btn-sm btn-primary" data-action="community.reply" data-id="${m.id}" data-author="${U.esc(l.name)}">➤</button></div></div>`;}).join(''):'<div class="empty"><div class="empty-icon">🌍</div><p>Aucune</p></div>';},
market(){const s=State.get();const l=State.currentLearner();const items=s.marketplace.filter(p=>p.approved||p.sellerId===l.id).sort((a,b)=>new Date(b.date)-new Date(a.date));return `<button class="btn btn-or btn-block mb-12" data-action="learner.newProduct">➕ Vendre</button>${items.length?items.map(p=>{const mine=p.sellerId===l.id;return `<div class="post-card" style="border-left:4px solid ${p.approved?'var(--v)':'var(--o)'}"><div style="display:flex;gap:10px;margin-bottom:8px">${p.image?`<img src="${p.image}" style="width:90px;height:90px;object-fit:cover;border-radius:8px">`:`<div style="width:90px;height:90px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:36px">📦</div>`}<div style="flex:1"><b>${U.esc(p.title)}</b><div style="color:var(--o);font-weight:800;font-size:17px">${U.money(p.price)}</div><small class="text-muted">${mine?'👤 Moi':'Vendeur : '+U.esc(p.sellerName||'?')}</small>${!p.approved?'<div class="badge badge-or" style="margin-top:4px">⏳</div>':''}</div></div><p style="font-size:13px;color:var(--m);margin-bottom:10px;white-space:pre-wrap">${U.esc(p.description||'')}</p><div class="flex">${p.whatsapp?`<a href="https://wa.me/${p.whatsapp.replace(/[^0-9]/g,'')}?text=${encodeURIComponent('Bonjour, je suis intéressé par : '+p.title)}" target="_blank" class="btn btn-vert btn-sm btn-block" style="text-decoration:none">💬</a>`:''}${mine?`<button class="btn btn-rouge btn-sm" data-action="learner.delProduct" data-id="${p.id}">🗑️</button>`:''}</div></div>`;}).join(''):'<div class="empty"><div class="empty-icon">🛒</div><p>Aucun</p></div>'}`;},
newProduct(){const s=State.get();const l=State.currentLearner();Md.open(`<div class="modal-title">🛒 Nouveau<button class="modal-close" data-action="modal.close">✕</button></div><div class="form-group"><label class="form-label">Titre *</label><input class="form-input" id="mp_title"></div><div class="form-group"><label class="form-label">Description *</label><textarea class="form-textarea" id="mp_desc" style="min-height:80px"></textarea></div><div class="form-group"><label class="form-label">Prix *</label><input class="form-input" id="mp_price" type="number"></div><div class="form-group"><label class="form-label">WhatsApp</label><input class="form-input" id="mp_wa" value="${U.esc(l.phone||'')}"></div><div class="form-group"><label class="form-label">Photo</label><input class="form-input" id="mp_img" type="file" accept="image/*"></div><button class="btn btn-vert btn-block" data-action="learner.saveProduct">📤</button>${s.settings.marketplaceAutoApprove?'':'<p class="text-muted mt-8" style="font-size:11px;text-align:center">⏳ Validation requise</p>'}`);},
saveProduct(){const t=document.getElementById('mp_title').value.trim();const d=document.getElementById('mp_desc').value.trim();const p=Number(document.getElementById('mp_price').value);const w=document.getElementById('mp_wa').value.trim();const f=document.getElementById('mp_img').files[0];if(!t||!p)return To.show('⚠️ Requis','error');const s=State.get();const l=State.currentLearner();const fin=(img)=>{s.marketplace.push({id:U.uid(),sellerId:l.id,sellerName:l.name,title:t,description:d,price:p,whatsapp:w,image:img||null,date:new Date().toISOString(),approved:!!s.settings.marketplaceAutoApprove});State.save();Md.close();To.show(s.settings.marketplaceAutoApprove?'✅':'⏳','success');this.comm();};if(!f)return fin(null);if(f.size>2*1024*1024)return To.show('⚠️ Image >2Mo','error');const r=new FileReader();r.onload=(e)=>{const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');const M=400;let w2=img.width,h2=img.height;if(w2>h2){if(w2>M){h2=h2*M/w2;w2=M;}}else{if(h2>M){w2=w2*M/h2;h2=M;}}cv.width=w2;cv.height=h2;cv.getContext('2d').drawImage(img,0,0,w2,h2);fin(cv.toDataURL('image/jpeg',0.7));};img.src=e.target.result;};r.readAsDataURL(f);},
delProduct(id){Dg.confirm('Supprimer ?',()=>{const s=State.get();s.marketplace=s.marketplace.filter(x=>x.id!==id);State.save();this.comm();},{danger:true,yes:'Oui'});},
profile(){if(State.get().currentUser?.role!=='learner')return Auth.logout();const l=State.currentLearner();const s=State.get();const st=Streak.get(l.id);const done=Object.values(l.exercises||{}).filter(Boolean).length;document.getElementById('lv-profile').innerHTML=`<div class="card"><div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:16px"><div style="position:relative">${U.avatar(l,'width:80px;height:80px;font-size:32px')}<label style="position:absolute;bottom:-4px;right:-4px;background:var(--o);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;border:2px solid #fff">📷<input type="file" accept="image/*" data-input="learner-photo" style="display:none"></label></div><div style="text-align:center"><b>${U.esc(l.name)}</b><br><small class="text-muted">${U.esc(l.phone||'')}</small></div></div><div class="form-group"><label class="form-label">Nom</label><input class="form-input" id="prof_name" value="${U.esc(l.name)}"></div><div class="form-group"><label class="form-label">Téléphone</label><input class="form-input" id="prof_phone" value="${U.esc(l.phone||'')}"></div><button class="btn btn-primary btn-block" data-action="learner.saveProfile">💾</button></div><div class="card"><div class="card-title">🔒 Sécurité</div><input class="form-input" id="prof_pwd" type="password" placeholder="6+ car. mixte"><button class="btn btn-outline btn-block mt-8" data-action="learner.changePwd">Changer</button></div><div class="card"><div class="card-title">📊 Stats</div><div style="display:flex;justify-content:space-between;padding:8px 0"><span>Modules</span><b>${done}/${Object.keys(s.modules).length}</b></div><div style="display:flex;justify-content:space-between;padding:8px 0"><span>Payé</span><b>${U.money(l.amountPaid||0)}</b></div><div style="display:flex;justify-content:space-between;padding:8px 0"><span>Série</span><b>${st.count} 🔥</b></div></div><div class="card"><div class="card-title">☎️ Aide</div>${s.settings.coachWhatsApp?`<a href="https://wa.me/${s.settings.coachWhatsApp.replace(/[^0-9]/g,'')}?text=${encodeURIComponent('Bonjour Coach, je suis '+l.name)}" target="_blank" class="btn btn-vert btn-block" style="text-decoration:none">💬 WhatsApp</a>`:'<p class="text-muted">Coach non configuré</p>'}</div>`;},
async saveProfile(){const l=State.currentLearner();const n=document.getElementById('prof_name').value.trim();const p=document.getElementById('prof_phone').value.trim();if(!n)return To.show('⚠️','error');l.name=n;l.phone=p;State.save();To.show('✅','success');document.getElementById('learnerWho').textContent=n;},
async changePwd(){const l=State.currentLearner();const p=document.getElementById('prof_pwd').value;if(!Cr.isStrong(p))return To.show('❌ 6+ mixte','error');l.passwordHash=await Cr.hash(p);State.save();document.getElementById('prof_pwd').value='';To.show('✅','success');},
buyPack(){const s=State.get();if(s.settings.chariowPackUrl)return this.pay('pack');const l=State.currentLearner();Dg.confirm(`Contactez le coach : ${s.settings.coachWhatsApp||'non configuré'}\n${U.money(s.settings.packPrice)}`,()=>{if(s.settings.coachWhatsApp)window.open(`https://wa.me/${s.settings.coachWhatsApp.replace(/[^0-9]/g,'')}?text=${encodeURIComponent('Bonjour, je veux le Pack Complet ('+U.money(s.settings.packPrice)+') - '+l.name)}`,'_blank');},{yes:'Ouvrir'});},
buyModule(mid){const s=State.get();if(s.settings.chariowModuleUrl)return this.pay('module',mid);const l=State.currentLearner();Dg.confirm(`Contactez le coach : ${s.settings.coachWhatsApp||'non configuré'}\n${U.money(s.settings.modulePrice)}`,()=>{if(s.settings.coachWhatsApp)window.open(`https://wa.me/${s.settings.coachWhatsApp.replace(/[^0-9]/g,'')}?text=${encodeURIComponent('Bonjour, je veux le Module '+mid+' - '+l.name)}`,'_blank');},{yes:'Ouvrir'});},
pay(type,mid){const s=State.get();const l=State.currentLearner();const base=type==='pack'?s.settings.chariowPackUrl:s.settings.chariowModuleUrl;if(!base)return;let ret=s.settings.paymentReturnUrl||(window.location.origin+window.location.pathname);try{const u=new URL(base);u.searchParams.set('return_url',ret);u.searchParams.set('type',type);if(mid)u.searchParams.set('mid',mid);u.searchParams.set('lid',l.id);window.location.href=u.toString();}catch{window.location.href=base;}}
};

const Actions={
map:{
'go':(el)=>Router.go(el.dataset.screen),
'nav':(el)=>{if(el.dataset.screen==='admin')AdminUI.go(el.dataset.tab);else if(el.dataset.screen==='learner')LearnerUI.go(el.dataset.tab);},
'modal.close':()=>Md.close(),
'auth.adminLogin':()=>Auth.adminLogin(),
'auth.learnerLogin':()=>Auth.learnerLogin(),
'auth.register':()=>Auth.register(),
'auth.logout':()=>Auth.logout(),
'auth.forgotPassword':()=>Auth.forgotPassword(),
'auth.sendForgot':()=>Auth.sendForgot(),
'admin.go':(el)=>AdminUI.go(el.dataset.tab),
'admin.filter':(el)=>AdminUI.filter(el.dataset.filter),
'admin.openDetail':(el)=>AdminUI.openDetail(el.dataset.id),
'admin.activate':(el)=>AdminUI.activate(el.dataset.id),
'admin.deactivate':(el)=>AdminUI.deactivate(el.dataset.id),
'admin.toggleUnlock':(el)=>AdminUI.toggleUnlock(el.dataset.id,el.dataset.k),
'admin.newModule':()=>AdminUI.newModule(),
'admin.saveNewModule':()=>AdminUI.saveNewModule(),
'admin.editModule':(el)=>AdminUI.editModule(el.dataset.mid),
'admin.saveModule':(el)=>AdminUI.saveModule(el.dataset.mid),
'admin.delModule':(el)=>AdminUI.delModule(el.dataset.mid),
'admin.addLesson':(el)=>AdminUI.addLesson(el.dataset.mid),
'admin.saveNewLesson':(el)=>AdminUI.saveNewLesson(el.dataset.mid),
'admin.editLesson':(el)=>AdminUI.editLesson(el.dataset.mid,el.dataset.idx),
'admin.saveLesson':(el)=>AdminUI.saveLesson(el.dataset.mid,el.dataset.idx),
'admin.delLesson':(el)=>AdminUI.delLesson(el.dataset.mid,el.dataset.idx),
'admin.approveSub':(el)=>AdminUI.approveSub(el.dataset.id),
'admin.rejectSub':(el)=>AdminUI.rejectSub(el.dataset.id),
'admin.sendAnn':()=>AdminUI.sendAnn(),
'admin.openChat':(el)=>AdminUI.openChat(el.dataset.id),
'admin.sendChat':()=>AdminUI.sendChat(),
'admin.commTab':(el)=>AdminUI.commTab(el.dataset.tab),
'admin.sendComm':()=>AdminUI.sendComm(),
'admin.delComm':(el)=>AdminUI.delComm(el.dataset.id),
'admin.approveMarket':(el)=>AdminUI.approveMarket(el.dataset.id),
'admin.delMarket':(el)=>AdminUI.delMarket(el.dataset.id),
'admin.manual':()=>AdminUI.manual(),
'admin.saveManual':()=>AdminUI.saveManual(),
'admin.approvePay':(el)=>AdminUI.approvePay(el.dataset.id),
'admin.rejectPay':(el)=>AdminUI.rejectPay(el.dataset.id),
'admin.savePricing':()=>AdminUI.savePricing(),
'admin.saveCoach':()=>AdminUI.saveCoach(),
'admin.savePwd':()=>AdminUI.savePwd(),
'admin.pullCloud':()=>AdminUI.pullCloud(),
'admin.pushCloud':()=>AdminUI.pushCloud(),
'quiz.select':(el)=>Quiz.select(el.dataset.q,el.dataset.o,el),
'quiz.submit':(el)=>Quiz.submit(el.dataset.module),
'quiz.start':(el)=>Quiz.start(el.dataset.module),
'learner.go':(el)=>LearnerUI.go(el.dataset.tab),
'learner.openModule':(el)=>LearnerUI.openModule(el.dataset.mid),
'learner.submit':(el)=>LearnerUI.submit(el.dataset.mid),
'learner.buyPack':()=>LearnerUI.buyPack(),
'learner.buyModule':(el)=>LearnerUI.buyModule(el.dataset.mid),
'learner.saveProfile':()=>LearnerUI.saveProfile(),
'learner.changePwd':()=>LearnerUI.changePwd(),
'learner.sendMsg':()=>LearnerUI.sendMsg(),
'learner.commTab':(el)=>LearnerUI.commTab(el.dataset.tab),
'learner.newProduct':()=>LearnerUI.newProduct(),
'learner.saveProduct':()=>LearnerUI.saveProduct(),
'learner.delProduct':(el)=>LearnerUI.delProduct(el.dataset.id),
'community.toggleReply':(el)=>{const b=document.getElementById('reply_box_'+el.dataset.id);if(b)b.style.display=b.style.display==='none'?'flex':'none';},
'community.like':(el)=>{const s=State.get();const p=s.community.find(x=>x.id===el.dataset.id);if(!p)return;p.likes=p.likes||[];const a=el.dataset.author;if(p.likes.includes(a))p.likes=p.likes.filter(x=>x!==a);else p.likes.push(a);State.save();if(State.currentUser?.role==='admin')AdminUI.comm();else if(State.currentUser?.role==='learner')LearnerUI.comm();},
'community.reply':(el)=>{const s=State.get();const p=s.community.find(x=>x.id===el.dataset.id);if(!p)return;const i=document.getElementById('reply_input_'+p.id);const t=i?.value.trim();if(!t)return;p.replies=p.replies||[];p.replies.push({name:el.dataset.author,text:t,date:new Date().toISOString()});State.save();if(State.currentUser?.role==='admin')AdminUI.comm();else if(State.currentUser?.role==='learner')LearnerUI.comm();}
},
init(){
document.addEventListener('click',(e)=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(this.map[a]){e.preventDefault();Hp.tap();try{this.map[a](el);}catch(err){console.error('[Action]',a,err);To.show('⚠️ Erreur','error');}}});
document.addEventListener('input',U.debounce((e)=>{if(e.target.dataset.input==='admin-search'){const list=document.getElementById('adminLearnersList');if(list)list.innerHTML=AdminUI.learnersHTML(e.target.value,AdminUI._filter);}},200));
document.addEventListener('change',(e)=>{if(e.target.dataset.input==='learner-photo'){const file=e.target.files[0];if(!file)return;if(file.size>3*1024*1024)return To.show('⚠️ >3Mo','error');const r=new FileReader();r.onload=(ev)=>{const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');const S=200;cv.width=S;cv.height=S;const ctx=cv.getContext('2d');const side=Math.min(img.width,img.height);const sx=(img.width-side)/2;const sy=(img.height-side)/2;ctx.drawImage(img,sx,sy,side,side,0,0,S,S);const l=State.currentLearner();if(l){l.photo=cv.toDataURL('image/jpeg',0.75);State.save();To.show('✅ Photo','success');LearnerUI.profile();}};img.src=ev.target.result;};r.readAsDataURL(file);}});
}
};

(async()=>{
try{
await State.init();
Actions.init();
Nw.init();
const s=State.get();
if(s.currentUser?.role==='admin'){AdminUI.open();}
else if(s.currentUser?.role==='learner'){const l=State.learner(s.currentUser.id);if(l){Streak.update(l.id);LearnerUI.open();}else{s.currentUser=null;State.save();Router.go('s-login');}}
else{Router.go('s-login');}
}catch(e){console.error('Init:',e);const b=document.getElementById('netBar');if(b){b.className='off';b.textContent='⚠️ Erreur init';}}
})();
</script>
</body>
</html>
